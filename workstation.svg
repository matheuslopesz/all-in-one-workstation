<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ecdc"/>
      <stop offset="1" stop-color="#cbbfa6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1050"/>
      <stop offset="0.55" stop-color="#b967ff"/>
      <stop offset="1" stop-color="#ff71ce"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffb96"/>
      <stop offset="1" stop-color="#ff71ce"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="25" y="22" width="78" height="56" rx="7"/>
    </clipPath>
    <mask id="stripes">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="0" y="50" width="128" height="1.6" fill="#000"/>
      <rect x="0" y="54" width="128" height="2.2" fill="#000"/>
      <rect x="0" y="58.5" width="128" height="2.8" fill="#000"/>
    </mask>
  </defs>

  <!-- stand -->
  <path d="M50 96 L78 96 L84 110 L44 110 Z" fill="#b5a98f"/>
  <rect x="34" y="107" width="60" height="9" rx="4.5" fill="url(#case)"/>

  <!-- CRT body -->
  <rect x="12" y="10" width="104" height="90" rx="12" fill="url(#case)"/>
  <rect x="12" y="10" width="104" height="90" rx="12" fill="none" stroke="#9c8f74" stroke-width="2"/>
  <rect x="19" y="16" width="90" height="68" rx="9" fill="#2b2440"/>

  <!-- screen -->
  <g clip-path="url(#screen)">
    <rect x="25" y="22" width="78" height="56" fill="url(#sky)"/>
    <circle cx="64" cy="50" r="17" fill="url(#sun)" mask="url(#stripes)"/>
    <rect x="25" y="62" width="78" height="16" fill="#1b0f33"/>
    <g stroke="#01cdfe" stroke-width="1.2" fill="none">
      <line x1="25" y1="62" x2="103" y2="62" stroke="#ff71ce" stroke-width="1.6"/>
      <line x1="25" y1="66" x2="103" y2="66"/>
      <line x1="25" y1="71" x2="103" y2="71"/>
      <line x1="25" y1="77" x2="103" y2="77"/>
      <line x1="64" y1="62" x2="64" y2="78"/>
      <line x1="56" y1="62" x2="44" y2="78"/>
      <line x1="72" y1="62" x2="84" y2="78"/>
      <line x1="48" y1="62" x2="24" y2="78"/>
      <line x1="80" y1="62" x2="104" y2="78"/>
    </g>
    <rect x="25" y="22" width="78" height="20" fill="#fff" opacity="0.07"/>
  </g>

  <!-- front panel: badge, vents, power LED -->
  <rect x="22" y="89" width="4" height="4" rx="1" fill="#ff71ce"/>
  <rect x="27" y="89" width="4" height="4" rx="1" fill="#01cdfe"/>
  <rect x="32" y="89" width="4" height="4" rx="1" fill="#05ffa1"/>
  <g stroke="#a89c80" stroke-width="1.6" stroke-linecap="round">
    <line x1="74" y1="91" x2="90" y2="91"/>
    <line x1="74" y1="94.5" x2="90" y2="94.5"/>
  </g>
  <circle cx="102" cy="92" r="3.2" fill="#05ffa1"/>
  <circle cx="102" cy="92" r="5.5" fill="#05ffa1" opacity="0.25"/>
</svg>
